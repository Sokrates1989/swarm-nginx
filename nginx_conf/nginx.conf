user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections  1024;
}

http {
    # Correctly load MIME types for static files like CSS, JS, etc.
    include       /etc/nginx/mime.types;  
    
    # Set default type to text/html, ensuring that HTML pages are displayed correctly, instead of download.
    default_type  text/html;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    server_tokens off;

    keepalive_timeout  60s;

    # Additional MIME types definition
    types {
        text/css                css;               # Serve .css with correct MIME
        application/javascript  js;                # Serve .js with correct MIME
        application/octet-stream bin;              # Example for binary files
        text/vcard              vcf;               # .vcf support
        text/html               html;              # Serve .html files
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Accept Real IP settings (X-Forwarded-For) from Docker Swarm cluster.
    set_real_ip_from    10.0.0.0/8;
    real_ip_header      X-Forwarded-For;

    # Include server-specific configurations.
    include /etc/nginx/conf.d/*.conf; 
}
